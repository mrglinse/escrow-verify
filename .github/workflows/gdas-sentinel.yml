name: GDAS 24/7 Continuous Sentinel

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch: # Allows manual trigger

jobs:
  run-sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & TSX
        run: |
          npm init -y
          npm install tsx typescript @types/node

      - name: Execute Anti-Scam Opportunity Scout
        run: npx tsx src/sentinel/opportunity-scout.ts

      - name: Execute Claude-Audited Worker Engine
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npx tsx src/sentinel/external-worker.ts

      - name: Commit & Push Generated Tasks and Patches
        run: |
          git config --global user.name "sentinel-bot"
          git config --global user.email "bot@sentinel.local"
          git add src/sentinel/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update bounties and generated patches [skip ci]" && git push)
          
