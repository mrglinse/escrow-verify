name: GDAS 24/7 Continuous Sentinel

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & TSX
        run: |
          npm install tsx typescript @types/node @octokit/rest

      - name: Ensure Data Directories Exist
        run: mkdir -p src/sentinel/data src/sentinel/patches

      - name: Execute Anti-Scam Opportunity Scout
        run: npx tsx src/sentinel/opportunity-scout.ts

      - name: Execute Claude-Audited Worker Engine
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npx tsx src/sentinel/external-worker.ts

      - name: Commit & Push Generated Tasks and Patches
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || (git commit -m "auto: update bounties and generated patches [skip ci]" && git push)
